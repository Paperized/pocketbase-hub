services:
  # Postgres 17 — required by fondoger/pocketbase (uses json_query added in PG17)
  postgres:
    image: postgres:17-alpine
    container_name: pocket-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Socket proxy — limits Docker API access to only what the dashboard needs
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      SERVICES: 1
      POST: 1
      DELETE: 1
    networks:
      - socket_net
    read_only: true
    tmpfs:
      - /run
      - /tmp

  # Internal Traefik — routes *.${APP_DOMAIN} to the correct PocketBase container
  # using the file provider (hot-reload on /dynamic/*.yml changes).
  #
  # Traefik auto-discovery (recommended):
  #   - Attach your public Traefik to the external "traefik-public" network.
  #   - The labels below automatically register this service with your public
  #     Traefik so that *.${APP_DOMAIN} is routed here with TLS termination.
  #   - Create the network once: docker network create traefik-public
  #
  # Manual / other reverse proxies:
  #   - Remove the labels block and the traefik-public network entries.
  #   - Forward *.${APP_DOMAIN} to 127.0.0.1:8082 from Nginx/Caddy/etc.
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    container_name: pocket-hub-traefik
    command:
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8082"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8080"   # Traefik dashboard (optional, debug)
    volumes:
      - ./traefik/dynamic:/dynamic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # Matches both the base domain and any subdomain — one rule covers all instances
      - "traefik.http.routers.pocket-hub.rule=HostRegexp(`^([a-z0-9-]+\\.)?${APP_DOMAIN}$$`)"
      - "traefik.http.routers.pocket-hub.entrypoints=websecure"
      # Port 8082 is the internal Traefik entrypoint defined in --entrypoints.web.address
      - "traefik.http.services.pocket-hub.loadbalancer.server.port=8082"
    networks:
      - demo_net
      - pb_network
      - traefik-public

  # Init — ensures bind-mount dirs exist with correct ownership (1001:1001)
  # before the dashboard starts. Runs once and exits.
  init-dirs:
    image: alpine:3
    user: root
    command: ["sh", "-c", "mkdir -p /instances /traefik/dynamic && chown -R 1001:1001 /instances /traefik"]
    volumes:
      - ./instances:/instances
      - ./traefik:/traefik
    restart: "no"

  dashboard:
    image: ghcr.io/paperized/pocketbase-hub:latest
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      init-dirs:
        condition: service_completed_successfully
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_SCHEME: https
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASS: ${DASHBOARD_PASS}
      POSTGRES_HOST: pocket-hub-postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INSTANCES_DIR: /instances
      TRAEFIK_DYNAMIC_DIR: /traefik/dynamic
      DOCKER_HOST: tcp://socket-proxy:2375
      PORT: 3000
    volumes:
      - ./instances:/instances
      - ./traefik/dynamic:/traefik/dynamic
    networks:
      - demo_net
      - socket_net
      - pb_network

volumes:
  postgres_data:

networks:
  demo_net:
    driver: bridge
  socket_net:
    internal: true
  pb_network:
    name: pb_network
    driver: bridge
  # External network shared with your public Traefik.
  # Required for Traefik auto-discovery via labels.
  # Create with: docker network create traefik-public
  # Remove this block (and the traefik service's network entry) if not using Traefik.
  traefik-public:
    external: true
